name: Publish to NPM

on:
  workflow_dispatch:

# Trusted publishing: npm authenticates this workflow via OIDC, so no NPM_TOKEN
# secret is needed. Configure it on npmjs.com under the package's Settings →
# Trusted Publisher (GitHub Actions, workflow filename publish.yml).
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # The branch picker accepts any branch, and npm's trusted publisher doesn't check it
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          # Don't restore a dependency cache into a job that can publish
          package-manager-cache: false

      # Trusted publishing needs npm 11.5.1 or later
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Render built bundles
        run: npm run test:bundle

      # Provenance is attached automatically when publishing via OIDC
      - name: Publish to NPM
        run: npm publish
