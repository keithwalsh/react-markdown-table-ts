name: Test Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        react: ['18', '19']

    name: test (React ${{ matrix.react }})

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install React ${{ matrix.react }}
      if: matrix.react != '18'
      run: npm install --no-save react@${{ matrix.react }} react-dom@${{ matrix.react }}

    - name: Lint
      if: matrix.react == '18'
      run: npm run lint

    - name: Typecheck
      run: npm run typecheck

    - name: Run tests with coverage
      run: npm run test:coverage

    - name: Build package
      run: npm run build

    - name: Render built bundles
      run: npm run test:bundle

    - name: Check package shape
      if: matrix.react == '18'
      run: npm run check:package

    - name: Upload coverage to Codecov
      if: matrix.react == '18'
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage/clover.xml,./coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: true
        verbose: true
